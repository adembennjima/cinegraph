name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: cinegraph-ci-password
      APP_API_KEY: cinegraph-ci-test-key
      OPENAI_MODEL: gpt-4.1-mini

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: make install

      - name: Check code quality
        run: make lint

      - name: Start Neo4j
        run: docker compose up -d --wait neo4j

      - name: Download data and build graph
        run: make setup-data

      - name: Run tests and measure coverage
        run: make test

      - name: Build application image
        run: docker compose build api

      - name: Show database logs on failure
        if: failure()
        run: docker compose logs --tail=100 neo4j

      - name: Stop services
        if: always()
        run: docker compose down
