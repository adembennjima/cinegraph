services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -a bolt://localhost:7687
          -u neo4j -p "$${NEO4J_AUTH#*/}"
          'RETURN 1' > /dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  api:
    build: .
    image: cinegraph:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4.1-mini}"
      APP_API_KEY: "${APP_API_KEY:?Set APP_API_KEY in .env}"
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/database', timeout=5)"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  ui:
    image: cinegraph:local
    command:
      - python
      - -m
      - streamlit
      - run
      - ui/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --browser.gatherUsageStats=false
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      API_BASE_URL: http://api:8000
      APP_API_KEY: "${APP_API_KEY:?Set APP_API_KEY in .env}"
    depends_on:
      api:
        condition: service_healthy

volumes:
  neo4j_data:
